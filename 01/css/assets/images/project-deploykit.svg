<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Mockup antarmuka DeployKit</title>
  <desc id="desc">Pipeline deployment dengan tiga tahap dan terminal perintah Docker.</desc>
  <defs>
